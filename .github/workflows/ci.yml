name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg and fontconfig
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - name: Install project
        run: python -m pip install -e .
      - name: Compile helpers
        run: python -m compileall -q skills/cutcraft/helpers
      - name: Validate plugin manifests
        run: |
          python -m json.tool .codex-plugin/plugin.json > /dev/null
          bash -n scripts/install-claude-code.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
